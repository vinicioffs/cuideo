<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calendario Yosemite</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --ios-red: #ff3b30;
            --ios-blue: #007aff;
            --ios-green: #34c759;
            --ios-purple: #af52de;
            --ios-bg-blur: rgba(255, 255, 255, 0.75);
            --ios-border: rgba(60, 60, 67, 0.15);
        }

        body { 
            font-family: '-apple-system', 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-image: url('static/image.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        /* --- PANTALLA DE LOGIN ESTILO IOS --- */
        #login-screen {
            background: var(--ios-bg-blur);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 25px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            width: 90%;
            max-width: 320px;
            margin: auto;
            border: 1px solid rgba(255,255,255,0.4);
        }
        #login-screen h2 { margin: 0 0 20px 0; color: #000; font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
        #login-screen input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid var(--ios-border);
            border-radius: 12px;
            margin-bottom: 15px;
            box-sizing: border-box;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            outline: none;
        }
        #login-screen input:focus { border-color: var(--ios-blue); }
        #login-screen button {
            width: 100%;
            padding: 14px;
            background-color: var(--ios-blue);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }
        #error-msg { color: var(--ios-red); font-size: 14px; margin-top: 15px; display: none; font-weight: 500; }

        /* --- CONTENEDOR DEL CALENDARIO --- */
        #calendar-container { 
            display: none; 
            width: 100%; 
            max-width: 1000px; 
            background: var(--ios-bg-blur);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15); 
            box-sizing: border-box;
            margin: 20px auto;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.4);
        }

        /* Cabecera estilo Apple (Mes grande a la izquierda) */
        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 10px 20px;
        }
        h1 { 
            margin: 0; 
            color: #000; 
            font-size: 32px; 
            font-weight: 700; 
            letter-spacing: -1px;
        }
        .nav-buttons {
            display: flex;
            gap: 15px;
        }
        .nav-buttons button {
            background: transparent;
            color: var(--ios-red);
            border: none;
            font-size: 24px;
            font-weight: 500;
            cursor: pointer;
            padding: 0 10px;
        }

        /* Días de la semana */
        .weekdays { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            font-size: 11px;
            font-weight: 600; 
            text-transform: uppercase;
            text-align: center; 
            color: rgba(60, 60, 67, 0.6);
            padding: 10px 0;
            border-bottom: 1px solid var(--ios-border);
        }
        
        /* Cuadrícula con bordes hairline tipo iOS */
        #calendar-grid { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            background: var(--ios-border); /* El fondo hace de borde */
            gap: 1px; /* Espaciado de 1px crea los bordes finos */
        }
        
        .day { 
            background: rgba(255, 255, 255, 0.6); 
            display: flex; 
            flex-direction: column; 
            height: 110px; 
            padding: 4px;
            box-sizing: border-box;
        }
        
        /* Número del día centrado arriba */
        .date-number { 
            font-weight: 500; 
            font-size: 15px;
            color: #000; 
            text-align: center;
            width: 28px;
            height: 28px;
            line-height: 28px;
            margin: 0 auto 4px auto;
            border-radius: 50%;
        }
        
        /* Estilo para el día de HOY (Círculo rojo iOS) */
        .current-day .date-number { 
            background: var(--ios-red); 
            color: white; 
            font-weight: 600;
        }

        /* Inputs transformados en "Eventos" (Píldoras) */
        .calendar-input { 
            width: 100%; 
            padding: 4px 6px; 
            margin-bottom: 4px;
            border: none; 
            border-radius: 4px; 
            font-size: 11px; 
            font-weight: 500;
            box-sizing: border-box;
            outline: none;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
            transition: background 0.2s, transform 0.1s;
        }
        
        .calendar-input:focus { 
            transform: scale(1.02);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 10;
            position: relative;
        }

        /* Colores Automáticos Apple Style */
        .bg-none { background: rgba(0, 0, 0, 0.05); color: #000; }
        .bg-red { background: var(--ios-red); color: white; }
        .bg-green { background: var(--ios-green); color: white; }
        .bg-fuchsia { background: var(--ios-purple); color: white; }

        /* --- ADAPTACIÓN PERFECTA PARA MÓVILES --- */
        @media (max-width: 768px) {
            body { padding: 0; }
            #calendar-container { 
                margin: 0; 
                border-radius: 0; /* Pantalla completa en móvil */
                min-height: 100vh;
                border: none;
            }
            .header-controls { padding: 40px 15px 10px 15px; } /* Más espacio arriba para la barra de estado iOS */
            h1 { font-size: 28px; }
            
            /* Maximizamos el espacio de las celdas */
            .day { padding: 2px; height: 95px; }
            .date-number { font-size: 13px; width: 24px; height: 24px; line-height: 24px; margin-bottom: 2px; }
            
            /* Entradas de texto más pequeñas pero de ancho completo */
            .calendar-input {
                font-size: 10px;
                padding: 4px 2px;
                border-radius: 3px;
                margin-bottom: 2px;
                letter-spacing: -0.3px; /* Ayuda a que quepan más letras */
            }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>Calendario</h2>
        <input type="password" id="passwd-input" placeholder="Contraseña" onkeypress="checkEnter(event)">
        <button onclick="verifyPassword()">Desbloquear</button>
        <div id="error-msg">Contraseña incorrecta</div>
    </div>

    <div id="calendar-container">
        <div class="header-controls">
            <h1 id="month-name">Calendario</h1>
            <div class="nav-buttons">
                <button onclick="changeMonth(-1)">&#10094;</button>
                <button onclick="changeMonth(1)">&#10095;</button>
            </div>
        </div>
        
        <div class="weekdays">
            <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
        </div>
        <div id="calendar-grid"></div>
    </div>

    <script>
        const PASSWORD_SECRETA = "1234"; 

        function checkEnter(e) {
            if (e.key === 'Enter') verifyPassword();
        }

        function verifyPassword() {
            const inputVal = document.getElementById('passwd-input').value;
            if (inputVal === PASSWORD_SECRETA) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('calendar-container').style.display = 'block';
                initCalendar();
            } else {
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('passwd-input').value = '';
            }
        }

        let currentDate = new Date();
        let currentMonth = currentDate.getMonth();
        let currentYear = currentDate.getFullYear();
        const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

        const realToday = new Date();
        const todayStr = `${realToday.getFullYear()}-${String(realToday.getMonth()+1).padStart(2, '0')}-${String(realToday.getDate()).padStart(2, '0')}`;

        // Lógica de color actualizada (se aplica directamente al input)
        function applyAutoColor(inputEl) {
            const text = inputEl.value.toLowerCase().trim();
            
            inputEl.classList.remove('bg-none', 'bg-red', 'bg-green', 'bg-fuchsia');

            if (text.includes('alberto')) {
                inputEl.classList.add('bg-red');
            } else if (text.includes('manuel')) {
                inputEl.classList.add('bg-green');
            } else if (text.includes('elena')) {
                inputEl.classList.add('bg-fuchsia');
            } else {
                inputEl.classList.add('bg-none');
            }
        }

        function saveAllData() {
            let data = {};
            const savedStr = localStorage.getItem('miCalendarioData_v2');
            if (savedStr) data = JSON.parse(savedStr);

            document.querySelectorAll('.day').forEach(dayEl => {
                const date = dayEl.dataset.date;
                if(!date) return;
                
                const inputs = dayEl.querySelectorAll('.calendar-input');
                if(inputs.length === 2) {
                    data[date] = {
                        top: { text: inputs[0].value },
                        bottom: { text: inputs[1].value }
                    };
                }
            });
            localStorage.setItem('miCalendarioData_v2', JSON.stringify(data));
        }

        function changeMonth(offset) {
            let newDate = new Date(currentYear, currentMonth + offset, 1);
            currentYear = newDate.getFullYear();
            currentMonth = newDate.getMonth();
            renderCalendar(currentYear, currentMonth);
        }

        function renderCalendar(year, month) {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = ''; 
            document.getElementById('month-name').textContent = monthNames[month] + " " + year;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let startDay = firstDay === 0 ? 6 : firstDay - 1;

            // Rellenar días vacíos al inicio
            for (let i = 0; i < startDay; i++) {
                let emptyDiv = document.createElement('div');
                emptyDiv.style.background = "rgba(255,255,255,0.3)";
                grid.appendChild(emptyDiv);
            }

            // Rellenar días del mes
            for (let i = 1; i <= daysInMonth; i++) {
                let dayDiv = document.createElement('div');
                dayDiv.className = 'day';
                const dateStr = `${year}-${String(month+1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                dayDiv.dataset.date = dateStr;

                if (dateStr === todayStr) {
                    dayDiv.classList.add('current-day');
                }

                dayDiv.innerHTML = `
                    <div class="date-number">${i}</div>
                    <input type="text" class="calendar-input bg-none" placeholder="..." oninput="applyAutoColor(this)" onchange="saveAllData()">
                    <input type="text" class="calendar-input bg-none" placeholder="..." oninput="applyAutoColor(this)" onchange="saveAllData()">
                `;
                grid.appendChild(dayDiv);
            }
            
            // Rellenar días vacíos al final para cuadrar la última fila
            const totalCells = startDay + daysInMonth;
            const remainingCells = (7 - (totalCells % 7)) % 7;
            for (let i = 0; i < remainingCells; i++) {
                let emptyDiv = document.createElement('div');
                emptyDiv.style.background = "rgba(255,255,255,0.3)";
                grid.appendChild(emptyDiv);
            }

            loadSavedData();
        }

        function loadSavedData() {
            const savedStr = localStorage.getItem('miCalendarioData_v2');
            if(!savedStr) return;
            
            const data = JSON.parse(savedStr);
            document.querySelectorAll('.day').forEach(dayEl => {
                const date = dayEl.dataset.date;
                if(data[date]) {
                    const inputs = dayEl.querySelectorAll('.calendar-input');
                    if(inputs.length === 2) {
                        inputs[0].value = data[date].top.text || '';
                        applyAutoColor(inputs[0]); 
                        
                        inputs[1].value = data[date].bottom.text || '';
                        applyAutoColor(inputs[1]); 
                    }
                }
            });
        }

        function initCalendar() {
            renderCalendar(currentYear, currentMonth);
        }
    </script>
</body>
</html>
