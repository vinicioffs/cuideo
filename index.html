<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calendario Yosemite</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Scripts oficiales de Firebase (Base de datos en la nube) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root {
            --ios-red: #ff3b30;
            --ios-blue: #007aff;
            --ios-green: #34c759;
            --ios-purple: #af52de;
            --ios-bg-blur: rgba(255, 255, 255, 0.75);
            --ios-border: rgba(60, 60, 67, 0.25);
            --ios-header-bg: rgba(229, 229, 234, 0.85); 
        }

        body { 
            font-family: '-apple-system', 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-image: url('static/image.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100dvh; 
            width: 100vw;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- PANTALLA DE LOGIN --- */
        #login-screen {
            background: var(--ios-bg-blur);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 25px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            width: 90%;
            max-width: 320px;
            border: 1px solid rgba(255,255,255,0.4);
        }
        #login-screen h2 { margin: 0 0 20px 0; color: #000; font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
        #login-screen input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 1px solid rgba(60, 60, 67, 0.15);
            border-radius: 12px;
            margin-bottom: 15px;
            box-sizing: border-box;
            text-align: center;
            background: rgba(255, 255, 255, 0.9);
            outline: none;
        }
        #login-screen input:focus { border-color: var(--ios-blue); }
        #login-screen button {
            width: 100%;
            padding: 14px;
            background-color: var(--ios-blue);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }
        #error-msg { color: var(--ios-red); font-size: 14px; margin-top: 15px; display: none; font-weight: 500; }
        #sync-msg { font-size: 12px; color: var(--ios-blue); margin-top: 10px; display: none; font-weight: 600; }

        /* --- CONTENEDOR DEL CALENDARIO --- */
        #calendar-container { 
            display: none; 
            flex-direction: column;
            width: 100%; 
            max-width: 1000px; 
            height: 100dvh; 
            background: var(--ios-bg-blur);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-sizing: border-box;
        }

        .header-controls {
            flex: 0 0 auto; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 45px 20px 15px 20px; 
        }
        h1 { 
            margin: 0; 
            color: #000; 
            font-size: 30px; 
            font-weight: 700; 
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        /* Indicador visual de guardado en la nube */
        .cloud-indicator {
            width: 8px; height: 8px; border-radius: 50%; background-color: var(--ios-green);
            display: inline-block; opacity: 0; transition: opacity 0.3s;
        }
        .nav-buttons button {
            background: transparent;
            color: var(--ios-red);
            border: none;
            font-size: 26px;
            font-weight: 500;
            cursor: pointer;
            padding: 0 10px;
        }
        
        #calendar-grid { 
            flex: 1 1 auto; 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            grid-template-rows: auto repeat(6, minmax(0, 1fr)); 
            background: var(--ios-border); 
            gap: 1px; 
            border-top: 1px solid var(--ios-border);
        }
        
        .weekday-box {
            background: var(--ios-header-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600; 
            text-transform: uppercase;
            color: rgba(60, 60, 67, 0.7);
            padding: 8px 0;
        }

        .day { 
            background: rgba(255, 255, 255, 0.65); 
            display: flex; 
            flex-direction: column; 
            padding: 3px;
            box-sizing: border-box;
            min-height: 0; 
        }
        
        .date-number { 
            font-weight: 500; 
            font-size: 14px;
            color: #000; 
            text-align: center;
            width: 24px;
            height: 24px;
            line-height: 24px;
            margin: 0 auto 3px auto;
            border-radius: 50%;
            flex: 0 0 auto;
        }
        
        .current-day .date-number { 
            background: var(--ios-red); 
            color: white; 
            font-weight: 600;
        }

        .calendar-input { 
            flex: 1 1 auto; 
            min-height: 0; 
            width: 100%; 
            padding: 2px 4px; 
            margin-bottom: 2px;
            border: none; 
            border-radius: 4px; 
            font-size: 10px; 
            font-weight: 500;
            box-sizing: border-box;
            outline: none;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
            letter-spacing: -0.3px;
        }
        .calendar-input:focus { z-index: 10; position: relative; }

        .bg-none { background: rgba(0, 0, 0, 0.05); color: #000; }
        .bg-red { background: var(--ios-red); color: white; }
        .bg-green { background: var(--ios-green); color: white; }
        .bg-fuchsia { background: var(--ios-purple); color: white; }

        @media (min-width: 769px) {
            #calendar-container { height: 85vh; border-radius: 24px; border: 1px solid rgba(255,255,255,0.4); box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
            .header-controls { padding: 20px; }
            .calendar-input { font-size: 12px; padding: 4px 6px; }
            .date-number { width: 28px; height: 28px; line-height: 28px; font-size: 15px; }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>Calendario</h2>
        <input type="password" id="passwd-input" placeholder="Contraseña" onkeypress="checkEnter(event)">
        <button onclick="verifyPassword()">Desbloquear</button>
        <div id="error-msg">Contraseña incorrecta</div>
        <div id="sync-msg">Conectando a la red...</div>
    </div>

    <div id="calendar-container">
        <div class="header-controls">
            <h1><span id="month-name">Calendario</span> <span class="cloud-indicator" id="cloud-status"></span></h1>
            <div class="nav-buttons">
                <button onclick="changeMonth(-1)">&#10094;</button>
                <button onclick="changeMonth(1)">&#10095;</button>
            </div>
        </div>
        <div id="calendar-grid"></div>
    </div>

    <script>
        // ==========================================
        // 1. CONFIGURACIÓN DE FIREBASE (PEGAR AQUÍ)
        // ==========================================
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            databaseURL: "https://TU_PROYECTO-default-rtdb.firebaseio.com", // Importante
            projectId: "TU_PROYECTO",
            storageBucket: "TU_PROYECTO.appspot.com",
            messagingSenderId: "TUS_NUMEROS",
            appId: "TU_APP_ID"
        };
        
        // Inicializamos la base de datos en la red
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let datosDescargados = false; // Evita sobreescribir datos antes de descargar
        
        // ==========================================

        const PASSWORD_SECRETA = "1234"; 

        function checkEnter(e) {
            if (e.key === 'Enter') verifyPassword();
        }

        function verifyPassword() {
            const inputVal = document.getElementById('passwd-input').value;
            if (inputVal === PASSWORD_SECRETA) {
                document.getElementById('error-msg').style.display = 'none';
                document.getElementById('sync-msg').style.display = 'block'; // Muestra "conectando..."
                
                // Cargamos los datos de la red ANTES de mostrar el calendario
                loadSavedDataFromCloud(() => {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('calendar-container').style.display = 'flex';
                    initCalendar();
                });
            } else {
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('passwd-input').value = '';
            }
        }

        let currentDate = new Date();
        let currentMonth = currentDate.getMonth();
        let currentYear = currentDate.getFullYear();
        const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

        const realToday = new Date();
        const todayStr = `${realToday.getFullYear()}-${String(realToday.getMonth()+1).padStart(2, '0')}-${String(realToday.getDate()).padStart(2, '0')}`;

        // Sistema de auto-guardado en red sin saturar
        let saveTimeout;
        function handleInput(inputEl) {
            applyAutoColor(inputEl);
            
            // Animación del puntito verde (guardando...)
            const indicator = document.getElementById('cloud-status');
            indicator.style.opacity = '1';
            indicator.style.backgroundColor = '#f59e0b'; // Naranja mientras escribes

            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                saveAllDataToCloud();
            }, 800); // Guarda 0.8s después de que dejes de teclear
        }

        function applyAutoColor(inputEl) {
            const text = inputEl.value.toLowerCase().trim();
            inputEl.classList.remove('bg-none', 'bg-red', 'bg-green', 'bg-fuchsia');

            if (text.includes('alberto')) { inputEl.classList.add('bg-red'); } 
            else if (text.includes('manuel')) { inputEl.classList.add('bg-green'); } 
            else if (text.includes('elena')) { inputEl.classList.add('bg-fuchsia'); } 
            else { inputEl.classList.add('bg-none'); }
        }

        function saveAllDataToCloud() {
            if (!datosDescargados) return; // Por seguridad

            let data = {};
            document.querySelectorAll('.day').forEach(dayEl => {
                const date = dayEl.dataset.date;
                if(!date) return;
                
                const inputs = dayEl.querySelectorAll('.calendar-input');
                if(inputs.length === 2) {
                    // Solo guardamos si hay texto para no llenar la BD de basura
                    if(inputs[0].value.trim() !== '' || inputs[1].value.trim() !== '') {
                        data[date] = {
                            top: { text: inputs[0].value },
                            bottom: { text: inputs[1].value }
                        };
                    }
                }
            });

            // Subir a Firebase
            db.ref('calendarioApp/datos').set(data).then(() => {
                const indicator = document.getElementById('cloud-status');
                indicator.style.backgroundColor = 'var(--ios-green)'; // Verde al guardarse con éxito
                setTimeout(() => { indicator.style.opacity = '0'; }, 1000); // Se oculta tras 1 seg
            });
        }

        // Variable global para almacenar los datos que bajan de la nube
        let cloudDataGlobal = {}; 

        function loadSavedDataFromCloud(onComplete) {
            db.ref('calendarioApp/datos').once('value').then((snapshot) => {
                cloudDataGlobal = snapshot.val() || {};
                datosDescargados = true;
                if(onComplete) onComplete();
            }).catch(error => {
                console.error("Error conectando a la nube: ", error);
                alert("Error conectando a la red. Comprueba tu internet o la configuración de Firebase.");
            });
        }

        function applyDataToView() {
            document.querySelectorAll('.day').forEach(dayEl => {
                const date = dayEl.dataset.date;
                if(cloudDataGlobal[date]) {
                    const inputs = dayEl.querySelectorAll('.calendar-input');
                    if(inputs.length === 2) {
                        inputs[0].value = cloudDataGlobal[date].top?.text || '';
                        applyAutoColor(inputs[0]); 
                        
                        inputs[1].value = cloudDataGlobal[date].bottom?.text || '';
                        applyAutoColor(inputs[1]); 
                    }
                }
            });
        }

        function changeMonth(offset) {
            let newDate = new Date(currentYear, currentMonth + offset, 1);
            currentYear = newDate.getFullYear();
            currentMonth = newDate.getMonth();
            renderCalendar(currentYear, currentMonth);
        }

        function renderCalendar(year, month) {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = ''; 
            document.getElementById('month-name').textContent = monthNames[month] + " " + year;

            const diasSemana = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
            diasSemana.forEach(dia => {
                const div = document.createElement('div');
                div.className = 'weekday-box';
                div.textContent = dia;
                grid.appendChild(div);
            });

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            let startDay = firstDay === 0 ? 6 : firstDay - 1;

            for (let i = 0; i < 42; i++) {
                let dayDiv = document.createElement('div');
                dayDiv.className = 'day';

                if (i >= startDay && i < startDay + daysInMonth) {
                    let dayNum = i - startDay + 1;
                    const dateStr = `${year}-${String(month+1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                    dayDiv.dataset.date = dateStr;

                    if (dateStr === todayStr) { dayDiv.classList.add('current-day'); }

                    dayDiv.innerHTML = `
                        <div class="date-number">${dayNum}</div>
                        <input type="text" class="calendar-input bg-none" placeholder="..." oninput="handleInput(this)">
                        <input type="text" class="calendar-input bg-none" placeholder="..." oninput="handleInput(this)">
                    `;
                } else {
                    dayDiv.style.background = "rgba(255,255,255,0.35)";
                }
                grid.appendChild(dayDiv);
            }
            
            applyDataToView();
        }

        function initCalendar() {
            renderCalendar(currentYear, currentMonth);
        }
    </script>
</body>
</html>
